<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGradient)"/>
  
  <!-- Title -->
  <text x="600" y="180" font-family="Arial, sans-serif" font-size="48" font-weight="bold" text-anchor="middle" fill="white">Tax Mitra 🇮🇳</text>
  
  <!-- Tagline -->
  <text x="600" y="240" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="white" opacity="0.9">Your tax notice, made understandable</text>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="40" fill="white" opacity="0.1"/>
  <circle cx="1100" cy="300" r="60" fill="white" opacity="0.1"/>
  <circle cx="200" cy="350" r="30" fill="white" opacity="0.1"/>
  <circle cx="1000" cy="80" r="25" fill="white" opacity="0.1"/>
</svg>